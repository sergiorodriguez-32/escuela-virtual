spring:
  application:
    name: campushub
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5433/campushub}
    username: ${JDBC_USER:campushub}
    password: ${JDBC_PASSWORD:campushub}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # Solo para la practica: en produccion usar migraciones
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/campushub}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: ${PORT:8080}
logging:
  level:
    org.springframework.cache: TRACE   # muestra si la clave se encuentra o no en cache
    org.hibernate.SQL: DEBUG           # si sale SQL, se ha ido a PostgreSQL; si no, vino de Redis
